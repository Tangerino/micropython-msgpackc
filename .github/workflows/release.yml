name: Release

# On a version tag (v1.2.3): build the ready-made firmware and publish them
# in a GitHub release, with the notes from tools/release-notes.sh.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.2
    strategy:
      matrix:
        include:
          - { target: "ESP32_GENERIC", name: "ESP32_GENERIC" }
          - { target: "ESP32_GENERIC SPIRAM", name: "ESP32_GENERIC-SPIRAM" }
          - { target: "ESP32_GENERIC_S3", name: "ESP32_GENERIC_S3" }
          - { target: "ESP32_GENERIC_C3", name: "ESP32_GENERIC_C3" }
          - { target: "ESP32_GENERIC_C6", name: "ESP32_GENERIC_C6" }
          - { target: "ESP32_GENERIC_P4", name: "ESP32_GENERIC_P4" }
          - { target: "ESP32_GENERIC_P4 PRE_REV3", name: "ESP32_GENERIC_P4-PRE_REV3" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          tools/build-esp32.sh ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir=$(echo '${{ matrix.target }}' | tr 'A-Z_ ' 'a-z--')
          mp=$(tools/release-notes.sh --mp-version)
          mkdir dist
          cp "build/$dir/firmware.bin" "dist/${{ matrix.name }}-$mp-msgpackc-${GITHUB_REF_NAME#v}.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: dist/*.bin

  release:
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "\"$version\"" cmodules/msgpackc/modmsgpackc.c || { echo "tag $GITHUB_REF_NAME does not match msgpackc.__version__"; exit 1; }
          tools/release-notes.sh "$version" > notes.md
          (cd dist && sha256sum -- *.bin > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "msgpackc $version" --notes-file notes.md
