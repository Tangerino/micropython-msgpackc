[project]
name = "upmsgpackc"
version = "1.0.0"
description = "Host-side tooling (tests, benchmarks, formatting) for the msgpackc MicroPython C module"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "msgpack>=1.1",          # reference implementation for interoperability tests
    "pytest>=8",
    "mpremote>=1.26",        # run code on the boards
    "pyserial>=3.5",
    "micropython-uncrustify==1.0.0.post1",  # the C formatter MicroPython uses
    "ruff==0.11.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 99
extend-exclude = ["micropython", "third_party", "tools/esp-idf", "tools/espressif", "build"]

[tool.ruff.lint]
# MicroPython code: const(), bare excepts kept for parity with umsgpack.
ignore = ["E722", "E731", "F403", "F405", "F821"]

[tool.ruff.lint.per-file-ignores]
# MicroPython test programs (run-tests.py style), as in micropython/tests.
"tests/mp/*" = ["E402", "E741", "E742", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests/host"]
